<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="purpleGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Highlight Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .pulsing-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 220px 140px;
    }
    .pulsing-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1060px 290px;
    }
    .floating-card-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .data-flow {
      stroke-dasharray: 10, 10;
      animation: flowLine 15s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #e2e8f0;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .card-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1280" height="440" fill="url(#bgGradient)" />
  <rect width="1280" height="440" fill="url(#gridPattern)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="pulsing-orb-1" cx="220" cy="140" r="260" fill="url(#purpleGlow)" />
  <circle class="pulsing-orb-2" cx="1060" cy="290" r="280" fill="url(#cyanGlow)" />

  <!-- Animated Data Connection Lines -->
  <path class="data-flow" d="M 100 380 Q 300 320 640 370 T 1180 340" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="data-flow" d="M 80 100 Q 400 150 720 90 T 1200 120" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Floating Feature Card Left -->
  <g class="floating-card-1">
    <rect x="70" y="260" width="240" height="95" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <circle cx="100" cy="292" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <path d="M 94 292 L 98 296 L 106 288" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="122" y="297" class="card-title">AI Redlining &amp; Playbooks</text>
    <text x="100" y="324" class="card-body">Autonomous clause analysis,</text>
    <text x="100" y="340" class="card-body">risk scoring &amp; Word add-ins</text>
  </g>

  <!-- Floating Feature Card Right -->
  <g class="floating-card-2">
    <rect x="970" y="80" width="240" height="95" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <circle cx="1000" cy="112" r="14" fill="#8b5cf6" fill-opacity="0.2" />
    <path d="M 994 112 L 1006 112 M 1000 106 L 1000 118" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <text x="1022" y="117" class="card-title">Enterprise CLM &amp; Q&amp;A</text>
    <text x="1000" y="144" class="card-body">Multi-document legal RAG &amp;</text>
    <text x="1000" y="160" class="card-body">natural language obligation Q&amp;A</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Unobscured) -->
  <g id="foreground-header">
    <!-- Tagline Badge -->
    <rect x="445" y="48" width="390" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="462" cy="63" r="5" fill="#38bdf8" />
    <text x="477" y="68" class="tagline">Interactive Contract AI Copilots &amp; CLM</text>

    <!-- Main Title -->
    <text x="640" y="135" text-anchor="middle" class="main-title" fill="url(#titleGrad)">
      Awesome Contract AI Agents
    </text>

    <!-- Subtitle -->
    <text x="640" y="180" text-anchor="middle" class="sub-title">
      Curated Ecosystem of SaaS CLM Platforms &amp; Open-Source Legal Intelligence
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(250, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="85" y="23" text-anchor="middle" class="pill-text">🤖 Legal AI Copilots</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="275" y="23" text-anchor="middle" class="pill-text">✍️ Automated Redlining</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="190" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="475" y="23" text-anchor="middle" class="pill-text">📑 Clause Extraction</text>

      <!-- Pill 4 -->
      <rect x="585" y="0" width="195" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="682" y="23" text-anchor="middle" class="pill-text">🔒 Private Legal RAG</text>
    </g>
  </g>
</svg>
